category: Storage
compatibility:
  adonis:
    "7": 7.x
description: Media-library for AdonisJS — owner collections (MIME whitelist,
  single-file replace, ordering), image conversions (eager/lazy), pluggable
  content transformers (HLS video via mediabunny, metadata probe), and column
  attachments, all on top of @adonisjs/drive. Pluggable MediaStore (in-memory +
  Lucid) and ImageProcessor (sharp). Part of the Agora ecosystem.
directory: packages/adonis
github: https://github.com/DavideCarvalho/adonis-agora-media
icon: agora.svg
maintainers:
  - github: DavideCarvalho
    name: DavideCarvalho
name: adonis-agora-media
npm: "@adonis-agora/media"
repo: DavideCarvalho/adonis-agora-media#master
type: 3rd-party
website: https://davidecarvalho.github.io/agora/docs/media
